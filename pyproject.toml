[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "video-rag"
version = "0.1.0"
description = "Video RAG prototype for coursework KR-1 and KR-2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5.23,<0.7",
  "faster-whisper>=1.1.1,<2.0",
  "fastapi>=0.115.0,<1.0",
  "loguru>=0.7.2,<1.0",
  "numpy>=1.26,<3.0",
  "openai>=1.68.0,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-dotenv>=1.0.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "razdel>=0.5.0,<0.6",
  "sentence-transformers>=3.3.1,<4.0",
  "tenacity>=9.0.0,<10.0",
  "tiktoken>=0.8.0,<1.0",
  "uvicorn>=0.30.0,<1.0"
]

[project.optional-dependencies]
dev = [
  "black>=25.1.0,<26.0",
  "pytest>=8.3.5,<9.0",
  "ruff>=0.11.4,<0.12"
]

[project.scripts]
video-rag-ingest = "video_rag.ingest.__main__:main"
video-rag-web = "video_rag.web.__main__:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
